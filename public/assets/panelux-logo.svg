<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Symbol - Blue P with Plus -->
  <g id="logo-symbol">
    <!-- Outer circle stroke -->
    <circle cx="160" cy="200" r="110" fill="none" stroke="#0891B2" stroke-width="30"/>

    <!-- Inner plus sign -->
    <g transform="translate(160, 200)">
      <!-- Vertical bar of plus -->
      <rect x="-20" y="-60" width="40" height="120" fill="#0891B2" rx="8"/>
      <!-- Horizontal bar of plus -->
      <rect x="-60" y="-20" width="120" height="40" fill="#0891B2" rx="8"/>
    </g>
  </g>

  <!-- Text "panelux" -->
  <text x="350" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="220" font-weight="600" fill="#3730A3" letter-spacing="-8">panelux</text>
</svg>
