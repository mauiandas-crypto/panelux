    <path d="M 30 20 Q 0 50 30 100 Q 40 130 80 130 L 80 90 Q 60 90 50 80 Q 35 70 35 55 Q 35 40 50 35 Q 60 30 80 30 L 80 0 Q 40 0 30 20" fill="#0891B2" stroke="none"/>

    <!-- Vertical bar of plus -->
    <rect x="65" y="40" width="30" height="110" rx="15" fill="#0891B2"/>

    <!-- Horizontal bar of plus (bottom part) -->
    <rect x="20" y="105" width="110" height="30" rx="15" fill="#0891B2"/>
  </g>

  <!-- Text "panelux" in dark purple -->
  <text x="230" y="150" font-family="Arial, sans-serif" font-size="130" font-weight="600" fill="#3B2667" letter-spacing="0">panelux</text>
</svg>
